## ===========================================================================
##  本工程的组件依赖清单
## ===========================================================================
##
## 【原来的原则】WS2812(RMT) / SSD1306 / SHT30 / AHT20 / BH1750 驱动全部为本仓库
##   自研，不依赖任何需要联网下载的"组件管理器"组件，保证无网环境也能编译。
##
## 【现状（已更新，2026-09）】这个原则为【离线语音识别】让了一步：
##   · 只有打开 menuconfig 里的
##       「智能家居 → 应用行为 → 语音识别来源 = INMP441 + ESP-SR」
##     时才真正需要 esp-sr；
##   · esp-sr 是乐鑫官方离线语音识别组件（唤醒词 WakeNet + 命令词 MultiNet），
##     体积大（含预训练模型，压缩包约 170MB）且带一堆预编译静态库，
##     自己重写不现实，所以只能通过组件管理器联网拉取一次；
##   · 拉取结果会落在本目录下【项目内的】 managed_components/ 里，
##     并写进 dependencies.lock —— 之后就是纯离线编译，不再联网。
##
##   为什么值得：
##     换来的能力是"不联网、不上云就能喊唤醒词 + 说命令词控制全屋"，
##     而且识别结果会被翻译成工程原有的 voice_cmd_t 走同一条下游链路，
##     不会破坏任何既有功能。
##
##   ⚠ 如果你要在【完全无网】的环境编译：
##       要么保证随源码一起带上 managed_components/ 目录（已被 .gitignore 排除，
##       需要手动拷贝），要么在 menuconfig 里把
##       「语音识别来源 = ESP-SR」关掉 —— 关掉后 CMake 不会 REQUIRES esp-sr，
##       工程就回到"零在线依赖"的状态。
## ===========================================================================
dependencies:
  idf:
    version: ">=5.4.0"

  # ★ 版本钉死（不是 ^2.3.1）：组件版本一变，模型/API 都可能跟着变，
  #   钉死才能保证"这台机器编译出来的固件"和文档描述的一致。
  #   esp-dsp / dl_fft 由 esp-sr 自己声明依赖，组件管理器会自动带上，不用手写。
  espressif/esp-sr:
    version: "2.3.1"

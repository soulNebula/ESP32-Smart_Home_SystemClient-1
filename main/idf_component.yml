# 模块：
#   在线组件依赖清单，被 idf.py 在下载依赖时读。
#   本工程只钉了一个在线组件：espressif/esp-sr，离线语音识别要用。
#   之所以只能联网拉：esp-sr 带预训练模型（压缩包约 170MB）和一堆预编译库，
#   自己重写不现实。拉下来的东西放在根目录的 managed_components/，
#   之后就是纯离线编译，不再联网。
#   版本写死成 2.3.1（不写 ^2.3.1）：版本一变模型和接口都可能跟着变，
#   钉死才能保证这台机器编出来的固件和文档写的一致。
#   esp-dsp / dl_fft 由 esp-sr 自己声明，组件管理器会自动带上，不用手写。
#   完全无网的环境：要么把 managed_components/ 一起带着（它被 .gitignore
#   排除，得手动拷），要么在 menuconfig 里把「语音识别来源 = ESP-SR」关掉，
#   关掉后 CMake 不会要 esp-sr，工程就回到零在线依赖的状态。
#
# 功能：
#   声明 IDF 版本
#   钉住 esp-sr 版本

dependencies:
  idf:
    version: ">=5.4.0"

  espressif/esp-sr:
    version: "2.3.1"
